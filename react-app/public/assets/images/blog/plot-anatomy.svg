<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Work Sans', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#b794f4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#0d0d13" rx="12"/>

  <!-- Title -->
  <text x="320" y="48" fill="#b794f4" font-size="15" font-weight="600">Revenue &amp; Units Sold (2019-2024)</text>

  <!-- Plot area -->
  <rect x="120" y="65" width="580" height="340" fill="#14141e" rx="4" stroke="#1e1e2e" stroke-width="1"/>

  <!-- Grid lines -->
  <line x1="120" y1="133" x2="700" y2="133" stroke="#1e1e2e" stroke-width="1"/>
  <line x1="120" y1="201" x2="700" y2="201" stroke="#1e1e2e" stroke-width="1"/>
  <line x1="120" y1="269" x2="700" y2="269" stroke="#1e1e2e" stroke-width="1"/>
  <line x1="120" y1="337" x2="700" y2="337" stroke="#1e1e2e" stroke-width="1"/>

  <!-- Y-axis label left -->
  <text x="18" y="240" fill="#6b7280" font-size="12" transform="rotate(-90,18,240)" text-anchor="middle">Revenue (MSEK)</text>

  <!-- Y-axis tick labels left -->
  <text x="108" y="72" fill="#6b7280" font-size="11" text-anchor="end">400</text>
  <text x="108" y="137" fill="#6b7280" font-size="11" text-anchor="end">300</text>
  <text x="108" y="205" fill="#6b7280" font-size="11" text-anchor="end">200</text>
  <text x="108" y="273" fill="#6b7280" font-size="11" text-anchor="end">100</text>
  <text x="108" y="341" fill="#6b7280" font-size="11" text-anchor="end">0</text>
  <text x="108" y="409" fill="#6b7280" font-size="11" text-anchor="end">-100</text>

  <!-- Y-axis label right -->
  <text x="882" y="240" fill="#6b7280" font-size="12" transform="rotate(90,882,240)" text-anchor="middle">Units Sold</text>

  <!-- Y-axis tick labels right -->
  <text x="712" y="72" fill="#6b7280" font-size="11" text-anchor="start">15k</text>
  <text x="712" y="137" fill="#6b7280" font-size="11" text-anchor="start">12k</text>
  <text x="712" y="205" fill="#6b7280" font-size="11" text-anchor="start">9k</text>
  <text x="712" y="273" fill="#6b7280" font-size="11" text-anchor="start">6k</text>
  <text x="712" y="341" fill="#6b7280" font-size="11" text-anchor="start">3k</text>
  <text x="712" y="409" fill="#6b7280" font-size="11" text-anchor="start">0</text>

  <!-- X-axis tick labels -->
  <text x="186" y="425" fill="#6b7280" font-size="12" text-anchor="middle">2019</text>
  <text x="282" y="425" fill="#6b7280" font-size="12" text-anchor="middle">2020</text>
  <text x="378" y="425" fill="#6b7280" font-size="12" text-anchor="middle">2021</text>
  <text x="474" y="425" fill="#6b7280" font-size="12" text-anchor="middle">2022</text>
  <text x="570" y="425" fill="#6b7280" font-size="12" text-anchor="middle">2023</text>
  <text x="666" y="425" fill="#6b7280" font-size="12" text-anchor="middle">2024</text>

  <!-- X-axis label -->
  <text x="410" y="450" fill="#6b7280" font-size="12" text-anchor="middle">Year</text>

  <!-- Bars (revenue) -->
  <rect x="162" y="269" width="48" height="68" fill="#4ade80" rx="2" opacity="0.85"/>
  <rect x="258" y="235" width="48" height="102" fill="#4ade80" rx="2" opacity="0.85"/>
  <rect x="354" y="337" width="48" height="40" fill="#ef4444" rx="2" opacity="0.85"/>
  <rect x="450" y="337" width="48" height="60" fill="#ef4444" rx="2" opacity="0.85"/>
  <rect x="546" y="302" width="48" height="35" fill="#4ade80" rx="2" opacity="0.85"/>
  <rect x="642" y="337" width="48" height="25" fill="#ef4444" rx="2" opacity="0.85"/>

  <!-- Line (units sold) -->
  <polyline points="186,250 282,140 378,170 474,300 570,280 666,310"
    fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="186" cy="250" r="5" fill="#f59e0b"/>
  <circle cx="282" cy="140" r="5" fill="#f59e0b"/>
  <circle cx="378" cy="170" r="5" fill="#f59e0b"/>
  <circle cx="474" cy="300" r="5" fill="#f59e0b"/>
  <circle cx="570" cy="280" r="5" fill="#f59e0b"/>
  <circle cx="666" cy="310" r="5" fill="#f59e0b"/>

  <!-- Legend -->
  <rect x="200" y="470" width="400" height="32" fill="#14141e" rx="6" stroke="#1e1e2e"/>
  <rect x="220" y="481" width="12" height="12" fill="#4ade80" rx="2"/>
  <text x="238" y="492" fill="#9ca3af" font-size="11">Profit</text>
  <rect x="300" y="481" width="12" height="12" fill="#ef4444" rx="2"/>
  <text x="318" y="492" fill="#9ca3af" font-size="11">Loss</text>
  <line x1="380" y1="487" x2="400" y2="487" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="390" cy="487" r="3" fill="#f59e0b"/>
  <text x="408" y="492" fill="#9ca3af" font-size="11">Units Sold</text>

  <!-- ========== ANNOTATIONS ========== -->

  <!-- 1. Title -->
  <text x="610" y="30" fill="#e9ecf2" font-size="12" font-weight="600">Title</text>
  <line x1="600" y1="34" x2="520" y2="44" stroke="#b794f4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2. Y-Axis Label (left) -->
  <text x="42" y="120" fill="#e9ecf2" font-size="12" font-weight="600">Y-Axis Label</text>
  <line x1="42" y1="124" x2="24" y2="190" stroke="#b794f4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 3. Y-Axis Label (right) -->
  <text x="760" y="120" fill="#e9ecf2" font-size="12" font-weight="600">Secondary Y-Axis</text>
  <line x1="850" y1="124" x2="876" y2="190" stroke="#b794f4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4. Tick Labels (left y) -->
  <text x="30" y="350" fill="#e9ecf2" font-size="12" font-weight="600">Tick Labels</text>
  <line x1="78" y1="344" x2="100" y2="338" stroke="#b794f4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 5. X-Axis Label -->
  <text x="420" y="540" fill="#e9ecf2" font-size="12" font-weight="600">X-Axis Label</text>
  <line x1="440" y1="534" x2="418" y2="455" stroke="#b794f4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 6. X-Axis Tick Labels -->
  <text x="148" y="455" fill="#e9ecf2" font-size="12" font-weight="600">Tick Labels</text>
  <line x1="180" y1="449" x2="186" y2="432" stroke="#b794f4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 7. Grid Lines -->
  <text x="740" y="202" fill="#e9ecf2" font-size="12" font-weight="600">Grid Lines</text>
  <line x1="740" y1="204" x2="702" y2="201" stroke="#b794f4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 8. Data Point (marker) -->
  <text x="310" y="120" fill="#e9ecf2" font-size="12" font-weight="600">Data Point</text>
  <line x1="332" y1="124" x2="284" y2="136" stroke="#b794f4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 9. Line (trend) -->
  <text x="520" y="260" fill="#e9ecf2" font-size="12" font-weight="600">Trend Line</text>
  <line x1="530" y1="264" x2="490" y2="280" stroke="#b794f4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 10. Bar -->
  <text x="158" y="216" fill="#e9ecf2" font-size="12" font-weight="600">Bar</text>
  <line x1="168" y1="222" x2="180" y2="265" stroke="#b794f4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 11. Plot Area -->
  <text x="740" y="80" fill="#e9ecf2" font-size="12" font-weight="600">Plot Area</text>
  <line x1="740" y1="82" x2="702" y2="70" stroke="#b794f4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 12. Legend -->
  <text x="620" y="485" fill="#e9ecf2" font-size="12" font-weight="600">Legend</text>
  <line x1="618" y1="483" x2="604" y2="483" stroke="#b794f4" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
